<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="246" viewBox="0 0 1080 246" role="img" aria-labelledby="title description">
  <title id="title">Bassem Gharib · Engineering Portfolio</title>
  <desc id="description">A navy masthead with a teal seismic trace plotted over a faint technical grid.</desc>
  <defs>
    <linearGradient id="field" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#101F31"/>
      <stop offset="0.61" stop-color="#0B1828"/>
